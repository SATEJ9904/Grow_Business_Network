apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

project.ext.vectoricons = [
    iconFontNames: ['Ionicons.ttf']
]

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Release signing credentials live in the untracked android/keystore.properties
// (gitignored) rather than gradle.properties, so the upload-key password never
// ends up committed to source control. Falls back to -PMYAPP_UPLOAD_* project
// properties (e.g. from CI secrets) when that file isn't present locally.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def uploadStoreFile = keystoreProperties['MYAPP_UPLOAD_STORE_FILE'] ?: project.findProperty('MYAPP_UPLOAD_STORE_FILE')
def uploadKeyAlias = keystoreProperties['MYAPP_UPLOAD_KEY_ALIAS'] ?: project.findProperty('MYAPP_UPLOAD_KEY_ALIAS')
def uploadStorePassword = keystoreProperties['MYAPP_UPLOAD_STORE_PASSWORD'] ?: project.findProperty('MYAPP_UPLOAD_STORE_PASSWORD')
def uploadKeyPassword = keystoreProperties['MYAPP_UPLOAD_KEY_PASSWORD'] ?: project.findProperty('MYAPP_UPLOAD_KEY_PASSWORD')

android {
    

    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.gbnsocialassociation"

    defaultConfig {
        applicationId "com.gbnsocialassociation"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.0.5"
    }

    // ✅ APK Split for smaller APKs (disabled for App Bundle builds — a bundle
    // can't have multiple per-ABI shrunk resource files, the bundle task splits by ABI itself)
    def isBundleBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains("bundle") }

    splits {
        abi {
            reset()
            enable !isBundleBuild
            universalApk !isBundleBuild
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    // ✅ Signing Configs
    signingConfigs {

        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            if (uploadStoreFile) {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    buildTypes {

        debug {
            signingConfig signingConfigs.debug
        }

        release {

            // ✅ Use Release Keystore
            signingConfig signingConfigs.release

            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds

            proguardFiles getDefaultProguardFile(
                    "proguard-android.txt"
            ), "proguard-rules.pro"
        }
    }
}

dependencies {

    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}